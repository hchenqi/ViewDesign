name: Build Examples

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, BuildEx, ExperimentalIcons]
  pull_request:
    branches: [main, BuildEx, ExperimentalIcons]
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          copy CMakeUserPresets.example.json CMakeUserPresets.json
          cmake --preset ninja-windows-msvc-x64-debug-win32-directx

      - name: Build
        shell: cmd
        run: cmake --build build/ninja-windows-msvc-x64-debug-win32-directx

      - uses: actions/upload-artifact@v4
        with:
          name: examples-ninja-msvc
          path: |
            build/ninja-windows-msvc-x64-debug-win32-directx/Example/**/*.exe
            build/ninja-windows-msvc-x64-debug-win32-directx/Example/**/*.dll

  windows-vs2026:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          copy CMakeUserPresets.example.json CMakeUserPresets.json
          cmake --preset vs2026-windows-msvc-x64-debug-win32-directx

      - name: Build
        shell: cmd
        run: cmake --build build/vs2026-windows-msvc-x64-debug-win32-directx

      - uses: actions/upload-artifact@v4
        with:
          name: examples-vs2026
          path: |
            build/vs2026-windows-msvc-x64-debug-win32-directx/Example/**/*.exe
            build/vs2026-windows-msvc-x64-debug-win32-directx/Example/**/*.dll

  linux-glfw-opengl:
    if: false
    runs-on: ubuntu-latest
    env:
      ICU_ROOT: /opt/icu
    steps:
      - uses: actions/checkout@v4

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Cache ICU
        id: cache-icu
        uses: actions/cache@v4
        with:
          path: ${{ env.ICU_ROOT }}
          key: icu-74-cxx23-${{ runner.os }}

      - name: Build ICU from source
        if: steps.cache-icu.outputs.cache-hit != 'true'
        run: |
          curl -L -o icu.tgz https://github.com/unicode-org/icu/releases/download/release-74-2/icu4c-74_2-src.tgz
          tar xzf icu.tgz
          cd icu/source
          CXXFLAGS=-std=c++23 ./configure --prefix=${{ env.ICU_ROOT }}
          make -j"$(nproc)"
          sudo make install
          sudo chown -R "$USER" ${{ env.ICU_ROOT }}

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          export PATH="${ICU_ROOT}/bin:${PATH}"
          export PKG_CONFIG_PATH="${ICU_ROOT}/lib/pkgconfig"
          cp CMakeUserPresets.example.json CMakeUserPresets.json
          cmake --preset ninja-linux-gcc-debug-glfw-opengl \
            -DICU_ROOT="${ICU_ROOT}" \
            -DCMAKE_PREFIX_PATH="${ICU_ROOT}" \
            -DCMAKE_FIND_ROOT_PATH="${ICU_ROOT}"

      - name: Build
        run: |
          export LD_LIBRARY_PATH="${ICU_ROOT}/lib"
          cmake --build build/ninja-linux-gcc-debug-glfw-opengl
